<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Retomar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #FF5A1F;outline-offset:3px}
.k{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ctr{display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 16px 16px; background: #141414; color: #FFFFFF; font-family: 'Roboto Mono', ui-monospace, monospace; display: flex; flex-direction: column; gap: 8px">
  <div style="padding: 0 8px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #A3A29E">Ayer · 19:40</span><span style="font-size: 34px; font-weight: 300; letter-spacing: -0.04em; line-height: 1">Te quedaste<br>a medias</span></div>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: 280px; height: 280px"><sc-for list="{{ring}}" as="d" hint-placeholder-count="24"><span style="position: absolute; left: {{d.x}}px; top: {{d.y}}px; width: 16px; height: 16px; border-radius: 50%; background: {{d.bg}}"></span></sc-for>
      <span class="ctr" style="position: absolute; left: 50px; top: 50px; width: 180px; height: 180px; border-radius: 50%; background: #FF5A1F; color: #141414; flex-direction: column; gap: 4px"><span style="font-size: 55px; font-weight: 300; line-height: 1">3/6</span><span class="k">Tabata</span></span>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
    <a href="J3Warmup.dc.html" class="ctr" style="height: 64px; border-radius: 16px; background: rgba(255,255,255,.12); font-size: 13px">Desde cero</a>
    <a href="J8Finish.dc.html" class="ctr" style="height: 64px; border-radius: 16px; background: rgba(255,255,255,.12); font-size: 13px">Terminar aquí</a>
  </div>
  <a href="J6Tabata.dc.html" style="height: 104px; flex: none; border-radius: 24px; background: #FF5A1F; color: #141414; padding: 0 16px 0 24px; display: flex; align-items: center; justify-content: space-between; font-size: 22px">Seguir<span class="ctr" style="width: 72px; height: 72px; border-radius: 50%; background: #141414"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 7.5C10 5.6 12.1 4.4 13.8 5.4L26.3 13.4C27.9 14.4 27.9 16.6 26.3 17.6L13.8 25.6C12.1 26.6 10 25.4 10 23.5Z" fill="#FF5A1F"></path></svg></span></a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const N = 24, done = 11, C = 140, R = 128;
    return { ring: Array.from({ length: N }, (_, i) => { const a = (2 * Math.PI * i) / N; return { x: (C + R * Math.sin(a) - 8).toFixed(1), y: (C - R * Math.cos(a) - 8).toFixed(1), bg: i < done ? '#FFFFFF' : (i === done ? '#FF5A1F' : 'rgba(255,255,255,0.2)') }; }) };
  }
}
</script>
</body>
</html>
