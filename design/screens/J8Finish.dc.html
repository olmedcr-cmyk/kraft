<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
.dot{transition:background-color .3s ease,transform .3s ease}
@media (prefers-reduced-motion: reduce){.dot{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 64px; background: #0A7B57; color: #FFFFFF; font-family: 'Roboto Mono', ui-monospace, monospace; display: flex; flex-direction: column">
  <div style="padding: 0 24px; display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 34px; font-weight: 300; letter-spacing: -0.04em">Hecho</span>
    <span style="width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 L6.5 11.5 L12.5 4.5" fill="none" stroke="#0A7B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
  </div>

  <div style="padding: 24px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <span style="aspect-ratio: 1; border-radius: 24px; background: rgba(255,255,255,0.14); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="width: 32px; height: 12px; border-radius: 999px; background: #FFFFFF"></span><span style="font-size: 34px; font-weight: 300">52'</span></span>
    <span style="aspect-ratio: 1; border-radius: 24px; background: rgba(255,255,255,0.14); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="width: 14px; height: 14px; border-radius: 4px; background: #FFFFFF"></span><span style="font-size: 34px; font-weight: 300">6</span></span>
    <span style="aspect-ratio: 1; border-radius: 24px; background: rgba(255,255,255,0.14); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF"></span><span style="font-size: 34px; font-weight: 300">18</span></span>
  </div>

  <a href="KR6Data.dc.html" aria-label="Esta semana: 3 días, 2 horas 30. Ver métricas" style="margin: 8px 16px 0; border-radius: 24px; background: rgba(255,255,255,0.14); color: #FFFFFF; text-decoration: none; padding: 16px; display: flex; align-items: flex-end; gap: 16px">
    <span style="flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; justify-items: center; height: 96px"><span style="display: flex; flex-direction: column-reverse; align-items: center; gap: 4px"><span style="font-size: 11px; padding-top: 4px; color: #FFFFFF">L</span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span></span><span style="display: flex; flex-direction: column-reverse; align-items: center; gap: 4px"><span style="font-size: 11px; padding-top: 4px; color: #FFFFFF">M</span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5A1F"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5A1F"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5A1F"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5A1F"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5A1F"></span></span><span style="display: flex; flex-direction: column-reverse; align-items: center; gap: 4px"><span style="font-size: 11px; padding-top: 4px; color: #FFFFFF">X</span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span></span><span style="display: flex; flex-direction: column-reverse; align-items: center; gap: 4px"><span style="font-size: 11px; padding-top: 4px; color: #FFFFFF">J</span><span style="width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 2px solid rgba(255,255,255,.35)"></span></span><span style="display: flex; flex-direction: column-reverse; align-items: center; gap: 4px"><span style="font-size: 11px; padding-top: 4px; color: #FFFFFF">V</span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span></span><span style="display: flex; flex-direction: column-reverse; align-items: center; gap: 4px"><span style="font-size: 11px; padding-top: 4px; color: #FFFFFF">S</span><span style="width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 2px solid rgba(255,255,255,.35)"></span></span><span style="display: flex; flex-direction: column-reverse; align-items: center; gap: 4px"><span style="font-size: 11px; padding-top: 4px; color: #FFFFFF">D</span><span style="width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 2px solid rgba(255,255,255,.35)"></span></span></span>
    <span style="display: flex; flex-direction: column; gap: 4px; align-items: flex-end"><span style="font-size: 34px; font-weight: 300; line-height: 1">3/4</span><span style="font-size: 11px; color: #FFFFFF">días · +8'</span></span>
  </a>
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 24px">
    <span style="font-size: 13px; color: #FFFFFF">Esfuerzo</span>
    <div role="radiogroup" aria-label="Esfuerzo de 1 a 5" style="display: flex; align-items: center; justify-content: space-between">
      <sc-for list="{{rpe}}" as="r" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{r.on}}" aria-label="{{r.n}} de 5" onClick="{{r.pick}}" class="dot" style="width: {{r.s}}px; height: {{r.s}}px; border-radius: 50%; padding: 0; box-sizing: border-box; border: 2px solid #FFFFFF; background: {{r.bg}}; cursor: pointer"></button>
      </sc-for>
    </div>
  </div>

  <button type="button" class="dot" onClick="{{send}}" aria-label="{{sendAria}}" style="height: 144px; border: 0; background: {{sendBg}}; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 16px; font-family: 'Roboto Mono', monospace">
    <span style="width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; color: #141414; display: flex; align-items: center; justify-content: center; font-size: 18px">E</span>
    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}"><svg width="40" height="40" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 L6.5 11.5 L12.5 4.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19 V5 M6 11 L12 5 L18 11" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { rpe: 4, sent: false }; }
  renderVals() {
    const s = this.state;
    return {
      rpe: [1, 2, 3, 4, 5].map((n) => ({ n: String(n), on: n === s.rpe ? 'true' : 'false', s: 28 + n * 10, bg: n <= s.rpe ? (n === s.rpe ? '#FF5A1F' : '#FFFFFF') : 'transparent', pick: () => this.setState({ rpe: n, sent: false }) })),
      sent: s.sent, notSent: !s.sent,
      sendBg: s.sent ? '#086748' : '#141414',
      sendAria: s.sent ? 'Enviado a tu entrenador' : 'Enviar a tu entrenador',
      send: () => this.setState({ sent: true }),
    };
  }
}
</script>
</body>
</html>
