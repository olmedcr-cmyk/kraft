</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const N = 30, done = 12, C = 140, R = 128;
    return { ring: Array.from({ length: N }, (_, i) => { const a = (2 * Math.PI * i) / N; return { x: (C + R * Math.sin(a) - 8).toFixed(1), y: (C - R * Math.cos(a) - 8).toFixed(1), bg: i < done ? 'rgba(255,255,255,0.2)' : (i === done ? '#FF5A1F' : '#FFFFFF') }; }) };
  }
}
</script>
