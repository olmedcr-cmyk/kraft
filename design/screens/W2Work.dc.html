<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return { dots: Array.from({ length: 30 }, (_, i) => ({ bg: i < 12 ? 'rgba(255,255,255,0.2)' : (i === 12 ? '#FF5A1F' : '#FFFFFF') })) }; }
}
