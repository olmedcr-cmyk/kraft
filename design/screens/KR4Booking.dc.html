      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 22px; font-weight: 300; line-height: 1">07:30</span>

    <span style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #5F5E59">Qué llevar</span>
    <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 11px">
      <li style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 32px; height: 32px; border-radius: 50%; background: #141414" aria-hidden="true"></span>Toalla</li>
